<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4BC88"/>
      <stop offset="100%" stop-color="#B89A62"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#FFF" stroke-width="1">
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
  </g>

  <!-- Hanger & Shirt Illustration -->
  <!-- Hanger hook -->
  <path d="M300,160 C300,130 320,110 335,125 C345,135 330,155 315,160" fill="none" stroke="url(#goldAccent)" stroke-width="4" stroke-linecap="round"/>
  <!-- Hanger bar -->
  <path d="M180,240 L300,180 L420,240" fill="none" stroke="url(#goldAccent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Shirt Body -->
  <path d="M220,225 L300,250 L380,225 L450,280 L420,380 L380,350 L380,620 L220,620 L220,350 L180,380 L150,280 Z" fill="url(#shirtGrad)" filter="drop-shadow(0px 15px 25px rgba(0,0,0,0.5))"/>

  <!-- Collar Left & Right -->
  <polygon points="300,250 250,215 280,290 300,255" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <polygon points="300,250 350,215 320,290 300,255" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <!-- Placket and Buttons -->
  <line x1="300" y1="255" x2="300" y2="620" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="300" cy="320" r="4" fill="#64748B" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="300" cy="380" r="4" fill="#64748B" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="300" cy="440" r="4" fill="#64748B" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="300" cy="500" r="4" fill="#64748B" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="300" cy="560" r="4" fill="#64748B" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Pocket Left -->
  <path d="M245,330 L275,330 L275,370 L260,380 L245,370 Z" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Brand Label Badge -->
  <rect x="180" y="670" width="240" height="45" fill="#171717" stroke="url(#goldAccent)" stroke-width="1.5"/>
  <text x="300" y="692" font-family="'Cinzel', serif, Georgia" font-size="13" font-weight="bold" fill="#D4BC88" text-anchor="middle" letter-spacing="3">JANAPRIYA</text>
  <text x="300" y="706" font-family="sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">ROYAL OXFORD SHIRT</text>
</svg>
