<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="kurtaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4BC88"/>
      <stop offset="100%" stop-color="#B89A62"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="#1C1917"/>

  <!-- Kurta Body -->
  <path d="M220,180 L300,200 L380,180 L460,250 L430,370 L390,340 L400,640 L385,640 L385,460 L375,460 L385,640 L215,640 L225,460 L215,460 L215,640 L200,640 L210,340 L170,370 L140,250 Z" fill="url(#kurtaGrad)" filter="drop-shadow(0px 15px 25px rgba(0,0,0,0.6))"/>

  <!-- Mandarin / Nehru Band Collar -->
  <path d="M265,185 C280,180 320,180 335,185 L335,210 C320,205 280,205 265,210 Z" fill="#713F12" stroke="url(#goldAccent)" stroke-width="1.5"/>

  <!-- Embroidered / Jacquard Button Placket -->
  <rect x="290" y="210" width="20" height="150" fill="#713F12" stroke="url(#goldAccent)" stroke-width="1.5"/>
  <circle cx="300" cy="235" r="3.5" fill="#FEF08A"/>
  <circle cx="300" cy="265" r="3.5" fill="#FEF08A"/>
  <circle cx="300" cy="295" r="3.5" fill="#FEF08A"/>
  <circle cx="300" cy="325" r="3.5" fill="#FEF08A"/>

  <!-- Side slit details -->
  <line x1="215" y1="460" x2="215" y2="640" stroke="#713F12" stroke-width="3"/>
  <line x1="385" y1="460" x2="385" y2="640" stroke="#713F12" stroke-width="3"/>

  <!-- Brand Label Badge -->
  <rect x="175" y="670" width="250" height="45" fill="#171717" stroke="url(#goldAccent)" stroke-width="1.5"/>
  <text x="300" y="692" font-family="'Cinzel', serif, Georgia" font-size="13" font-weight="bold" fill="#D4BC88" text-anchor="middle" letter-spacing="3">JANAPRIYA</text>
  <text x="300" y="706" font-family="sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">FESTIVE JACQUARD KURTA</text>
</svg>
