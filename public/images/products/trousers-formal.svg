<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1918"/>
      <stop offset="100%" stop-color="#0F0E0E"/>
    </linearGradient>
    <linearGradient id="pantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4BC88"/>
      <stop offset="100%" stop-color="#B89A62"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bgGrad2)"/>

  <!-- Trousers Shape -->
  <!-- Waistband -->
  <rect x="200" y="200" width="200" height="30" rx="3" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <rect x="290" y="205" width="20" height="20" fill="none" stroke="url(#goldAccent)" stroke-width="2"/>
  
  <!-- Belt loops -->
  <rect x="225" y="198" width="6" height="34" fill="#475569"/>
  <rect x="260" y="198" width="6" height="34" fill="#475569"/>
  <rect x="335" y="198" width="6" height="34" fill="#475569"/>
  <rect x="370" y="198" width="6" height="34" fill="#475569"/>

  <!-- Legs -->
  <path d="M200,230 L210,630 L275,630 L295,350 L305,350 L325,630 L390,630 L400,230 Z" fill="url(#pantGrad)" filter="drop-shadow(0px 15px 25px rgba(0,0,0,0.6))"/>
  
  <!-- Crease lines (Sharp tailored iron lines) -->
  <line x1="242" y1="260" x2="242" y2="620" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8 3" opacity="0.7"/>
  <line x1="358" y1="260" x2="358" y2="620" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8 3" opacity="0.7"/>

  <!-- Pocket Welts -->
  <line x1="210" y1="245" x2="250" y2="280" stroke="#1E293B" stroke-width="3"/>
  <line x1="390" y1="245" x2="350" y2="280" stroke="#1E293B" stroke-width="3"/>

  <!-- Brand Label Badge -->
  <rect x="175" y="670" width="250" height="45" fill="#171717" stroke="url(#goldAccent)" stroke-width="1.5"/>
  <text x="300" y="692" font-family="'Cinzel', serif, Georgia" font-size="13" font-weight="bold" fill="#D4BC88" text-anchor="middle" letter-spacing="3">JANAPRIYA</text>
  <text x="300" y="706" font-family="sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">TAILORED STRETCH TROUSERS</text>
</svg>
