<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1B18"/>
      <stop offset="50%" stop-color="#141311"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E7C8"/>
      <stop offset="50%" stop-color="#D4BC88"/>
      <stop offset="100%" stop-color="#9B7E48"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgH)"/>

  <!-- Geometric artisanal cutting pattern lines -->
  <g opacity="0.12" stroke="#D4BC88" stroke-width="1.5">
    <circle cx="600" cy="300" r="220" fill="none" stroke-dasharray="8 6"/>
    <circle cx="600" cy="300" r="180" fill="none"/>
    <circle cx="600" cy="300" r="120" fill="none" stroke-dasharray="4 4"/>
    <line x1="300" y1="300" x2="900" y2="300"/>
    <line x1="600" y1="100" x2="600" y2="500"/>
  </g>

  <!-- Tailoring Scissors in Center -->
  <g transform="translate(600, 240) scale(1.4)" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.8))">
    <!-- Blade 1 -->
    <path d="M-8,15 L-3,-70 L-0.5,-75 L2,-70 L2,15 Z" fill="url(#goldH)"/>
    <!-- Blade 2 -->
    <path d="M2,15 L7,-70 L4.5,-75 L2,-70 L-2,15 Z" fill="url(#goldH)" opacity="0.9"/>
    <!-- Pivot screw -->
    <circle cx="0" cy="15" r="4.5" fill="#1C1B18" stroke="url(#goldH)" stroke-width="2"/>
    <!-- Handles -->
    <path d="M-4,20 C-10,35 -30,45 -30,65 C-30,80 -15,90 0,75 C0,65 -5,50 -2,35 Z" fill="none" stroke="url(#goldH)" stroke-width="4.5"/>
    <path d="M4,20 C10,35 30,45 30,65 C30,80 15,90 0,75 C0,65 5,50 2,35 Z" fill="none" stroke="url(#goldH)" stroke-width="4.5"/>
  </g>

  <!-- Measuring tape curve at bottom -->
  <path d="M200,440 Q600,510 1000,440" fill="none" stroke="#D4BC88" stroke-width="8" stroke-dasharray="2 8" opacity="0.4"/>

  <!-- Typography -->
  <text x="600" y="440" font-family="'Cinzel', serif, Georgia" font-size="28" font-weight="bold" fill="url(#goldH)" text-anchor="middle" letter-spacing="8">JANAPRIYA GARMENTS</text>
  <text x="600" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#A8A29E" text-anchor="middle" letter-spacing="6">MODERN MENSWEAR &amp; BESPOKE TAILORING STUDIO</text>
</svg>
